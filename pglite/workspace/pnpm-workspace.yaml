packages:
  - 'packages/*'

# Managed by pnpm-policy — run `pnpm-policy generate` after editing pnpm-policy.yaml.

# A third-party release must be 2d old before it can be installed.
# Most malicious releases are found and yanked well inside that window.
minimumReleaseAge: 2880

# Transitive dependencies must come from the registry, not from git or a URL.
blockExoticSubdeps: true
allowBuilds:
  "@launchql/protobufjs": false
  "@parcel/watcher": false
  nx: false
  unrs-resolver: false

# Exempt from the wait: 6 scope glob(s), 28 first-party package(s).
# First-party membership comes from the inventory and the names claimed in pnpm-policy.yaml.
minimumReleaseAgeExclude:
  - "@constructive-db/*"
  - "@constructive-io/*"
  - "@launchql/*"
  - "@pgpm/*"
  - "@pgpmjs/*"
  - "@pgsql/*"
  - 12factor-env
  - appstash
  - csv-to-pg
  - find-and-require-package-json
  - genomic
  - git-changed
  - graphile-scoped-introspection
  - graphile-storage-registry
  - inquirerer
  - libpg-query
  - makage
  - nested-obj
  - pg-cache
  - pg-env
  - pg-proto-parser
  - pg-seed
  - pglite-test
  - pgsql-client
  - pgsql-deparser
  - pgsql-parser
  - pgsql-seed
  - pgsql-test
  - plpgsql-deparser
  - plpgsql-parser
  - pnpm-policy
  - strfy-js
  - yamlize
  - yanse
